name: Build, check and deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild so "N days before this build" and staleness warnings stay current.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.151.0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git info for lastmod
      - name: Install Hugo
        run: |
          curl -fsSLo hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/hugo" && tar -C "$HOME/.local/hugo" -xzf hugo.tgz hugo && rm hugo.tgz
          echo "$HOME/.local/hugo" >> "$GITHUB_PATH"
      - name: Build
        run: |
          git config core.quotepath false
          hugo --gc --minify
      - name: Check content and build output
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check.py public
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public 'public/**/*.html'
          fail: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [secrets, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
