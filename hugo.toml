baseURL = "https://blog.seolcu.com/"
languageCode = "en"
title = "seolcu notes"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Verified fixes and setup notes for Linux, self-hosting and home-lab operations, plus an index of seolcu's open-source projects. Every page states its status, the environment it was verified on, and when."
  author = "Gyuwon Seol (seolcu)"
  github = "https://github.com/seolcu"
  # Shown in llms.txt and page footers only when set.
  sponsor = "https://github.com/sponsors/seolcu"
  staleDays = 365
  # Search-engine ownership tokens (public by design). Rendered as <meta> tags on every page.
  [params.verification]
    google = "X831KdG-7BV0yxloB6k98mptq3xycLVNq9n6XZ4woCw"
    bing = ""
    naver = ""

[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    rel = "alternate"
    permalinkable = false
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    rel = "alternate"
  [outputFormats.json]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputs]
  home = ["html", "rss", "json", "llms", "llmsfull"]
  section = ["html", "rss"]
  page = ["html", "markdown"]

[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.goldmark.renderer]
    unsafe = false

[sitemap]
  changeFreq = "monthly"
